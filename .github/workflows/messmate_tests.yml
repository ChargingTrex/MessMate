name: MessMate Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install robotframework
          pip install robotframework-seleniumlibrary
          pip install robotframework-requests
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install ChromeDriver
        run: |
          pip install webdriver-manager
          python -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()"

      - name: Smoke tests (no credentials needed)
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
        run: |
          # One or two checks per feature. Fails in seconds if something is
          # broadly broken, before the longer suites spend a runner minute.
          python test/test_smoke.py

      - name: End-to-end journeys (no credentials needed)
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
        run: |
          python test/test_committee.py
          python test/test_e2e_committee.py
          python test/test_e2e_student.py

      - name: Start committee UI test server (in-memory backend)
        run: |
          python test/fake_server.py 5001 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:5001/health && break
            sleep 1
          done

      - name: Run Robot Framework tests (committee suites)
        env:
          DASHBOARD_TOKEN: vc2026
          ADMIN_PASSWORD: admin-test-password
        run: |
          robot --variable BASE_URL:http://127.0.0.1:5001 \
                --outputdir tests/results/committee \
                tests/committee_api_tests.robot \
                tests/committee_form_tests.robot \
                tests/committee_admin_tests.robot \
                tests/committee_dashboard_tests.robot

      - name: Start MessMate app (needs live Google Sheets secrets)
        env:
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          # app.py raises at import when FLASK_SECRET_KEY is missing. Backgrounding
          # it hides that: the step exits 0 and the student suites below then fail
          # with 22 connection-refused errors that name no cause. Check up front so
          # the log says what is actually wrong.
          if [ -z "$FLASK_SECRET_KEY" ]; then
            echo "::error::FLASK_SECRET_KEY repository secret is not set, so app.py cannot boot."
            echo "The student suites need a live spreadsheet: set FLASK_SECRET_KEY, SPREADSHEET_ID,"
            echo "GOOGLE_CREDENTIALS_JSON and DASHBOARD_TOKEN under Settings > Secrets and variables > Actions."
            echo "The committee suites above need none of these and have already run."
            exit 1
          fi

          python app.py &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:5000/health >/dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:5000/health >/dev/null; then
            echo "::error::app.py never became healthy on port 5000 — see the traceback above."
            exit 1
          fi

      - name: Run Robot Framework tests (student suites, live sheet)
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          robot --include smoke \
                --include api \
                --outputdir tests/results/student \
                tests/form_tests.robot \
                tests/dashboard_tests.robot \
                tests/api_tests.robot

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: tests/results/
