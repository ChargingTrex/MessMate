name: MessMate Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install robotframework
          pip install robotframework-seleniumlibrary
          pip install robotframework-requests
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install ChromeDriver
        run: |
          pip install webdriver-manager
          python -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()"

      - name: Start MessMate app
        env:
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          TEST_COMMITTEE_EMAIL: ${{ secrets.TEST_COMMITTEE_EMAIL }}
          TEST_COMMITTEE_PASSWORD: ${{ secrets.TEST_COMMITTEE_PASSWORD }}
        run: |
          python app.py &
          sleep 3

      - name: Run committee checks (no credentials needed)
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
        run: |
          python test/test_committee.py
          python test/test_e2e_committee.py

      - name: Run Robot Framework tests (student suites, live sheet)
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          robot --include smoke \
                --include api \
                --outputdir tests/results/student \
                tests/form_tests.robot \
                tests/dashboard_tests.robot \
                tests/api_tests.robot

      - name: Start committee UI test server (in-memory backend)
        run: |
          python test/fake_server.py 5001 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:5001/health && break
            sleep 1
          done

      - name: Run Robot Framework tests (committee suites)
        env:
          DASHBOARD_TOKEN: vc2026
          ADMIN_PASSWORD: admin-test-password
        run: |
          robot --variable BASE_URL:http://127.0.0.1:5001 \
                --outputdir tests/results/committee \
                tests/committee_api_tests.robot \
                tests/committee_form_tests.robot \
                tests/committee_admin_tests.robot \
                tests/committee_dashboard_tests.robot

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: robot-results
          path: tests/results/
