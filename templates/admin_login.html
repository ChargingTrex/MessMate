<!--
  Admin Login (admin_login.html)
  -------------------------------
  Required for roster changes. The legacy ?token= credential still opens the
  read-only dashboards, but cannot reach anything that mutates the roster.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessMate — Admin Login</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

    {% if error %}
    <div class="alert error error-banner">{{ error }}</div>
    {% endif %}

    <main class="auth-card">
        <div class="auth-brand">
            <span class="live-dot" title="Live"></span>
            <span class="brand-logo">MESSMATE</span>
        </div>

        <h1>Admin sign in</h1>
        <p class="subtext-line">Required to manage the Food Committee roster.</p>

        <form method="POST" action="{{ url_for('admin_login') }}">
            {{ csrf_field() }}
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

            <label class="item-label" for="password">Admin password</label>
            <input class="suggestion-input" type="password" id="password" name="password"
                   autocomplete="current-password" required autofocus>

            <div class="form-actions">
                <button type="submit" id="admin-login-btn" class="submit-btn">Sign in</button>
            </div>
        </form>
    </main>
</body>
</html>
