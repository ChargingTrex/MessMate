{#
  Shared <head> for every page but the student home (_head.html)
  ---------------------------------------------------
  Set `page_title` before including. Chart.js is NOT loaded here — only the
  two dashboards need it, and they add it themselves.
#}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
{% include '_theme_head.html' %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>window.MESSMATE_UI = {{ ui.json }};</script>
<script defer src="{{ url_for('static', filename='app-shell.js') }}"></script>
<script defer src="{{ url_for('static', filename='theme.js') }}"></script>
