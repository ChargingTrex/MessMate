<!--
  Committee Password Change (committee_password.html)
  ----------------------------------------------------
  Forced at first login and after an admin reset. The password an admin hands
  out is displayed on screen once and usually relayed over chat, so it is
  treated as single-use.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessMate — Set Your Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>MessMate</h1>
        <p>Food Committee 🍽️</p>
    </header>

    <main>
        {% if error %}
        <div class="alert error error-banner">{{ error }}</div>
        {% endif %}

        <section class="card">
            <h2>Choose your password</h2>
            <p class="subtext-line">
                Hi {{ member.Name }} — the password you were given is temporary.
                Please set your own before continuing.
            </p>

            <form method="POST" action="{{ url_for('committee_password') }}">
                {{ csrf_field() }}

                <label class="item-label" for="password">New password</label>
                <input class="suggestion-input" type="password" id="password" name="password"
                       autocomplete="new-password" minlength="8" required autofocus>
                <p class="char-counter" style="text-align:left;">At least 8 characters</p>

                <label class="item-label" style="margin-top:16px;" for="confirm">Confirm password</label>
                <input class="suggestion-input" type="password" id="confirm" name="confirm"
                       autocomplete="new-password" minlength="8" required>

                <div class="submit-container" style="margin-top:24px; padding:0;">
                    <button type="submit" id="password-btn" class="submit-btn">Save and continue</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
